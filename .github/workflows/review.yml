name: Shelf review
on:
  push:
    branches: [main]
  # Validate stacked review PRs as well as PRs targeting the default branch.
  pull_request:
  workflow_dispatch:

# Only superseded PR revisions cancel each other. Default/manual runs remain
# independent so the actual integrated commit retains its own verification.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  validate:
    name: Components and built HTTP PostgreSQL regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: review
          POSTGRES_PASSWORD: review_fixture_only
          POSTGRES_DB: shelf_review
        ports:
          - 55443:5432
        options: >-
          --health-cmd "pg_isready -U review -d shelf_review"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Disposable CI fixture only; integration guards pin host/port/database.
      DATABASE_URL: postgresql://review:review_fixture_only@127.0.0.1:55443/shelf_review
      SHELF_REVIEW_DB: '1'
      MC_PASSWORD: CI-only-review-password
      MC_SESSION_SECRET: ci-only-shelf-session-fixture-0000000000
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=low
      - run: pnpm exec prisma generate
      - run: pnpm exec prisma migrate deploy
      - run: pnpm lint
      - run: pnpm exec next typegen
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      - run: pnpm build
      - run: node --test tests/review-server.test.mjs
      - run: node tests/inventory-http.mjs
      - run: node tests/import-http.mjs
      - run: node tests/inventory-race-http.mjs
      - run: node tests/inventory-stale-http.mjs
      - run: pnpm exec playwright install --with-deps chromium webkit firefox
      - run: node tests/inventory-browser.mjs
      - run: node tests/import-browser.mjs

      - run: node tests/inventory-browser.mjs
        env:
          SHELF_REVIEW_BROWSER: webkit
      - run: node tests/import-browser.mjs
        env:
          SHELF_REVIEW_BROWSER: webkit

      - run: node tests/inventory-browser.mjs
        env:
          SHELF_REVIEW_BROWSER: firefox
      - run: node tests/import-browser.mjs
        env:
          SHELF_REVIEW_BROWSER: firefox
