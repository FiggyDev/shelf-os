services:
  db:
    image: postgres:17
    container_name: shelf-os-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: shelfos
      POSTGRES_PASSWORD: shelfos_dev
      POSTGRES_DB: shelfos
    ports:
      - "55440:5432"
    volumes:
      - shelf_os_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shelfos -d shelfos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  shelf_os_pgdata:
